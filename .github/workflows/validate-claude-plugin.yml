name: Validate Claude plugin

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DISABLE_AUTOUPDATER: 1
      DISABLE_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate --strict claude
      - run: claude plugin validate --strict claude/.claude-plugin/plugin.json
      - run: jq -e '.mcpServers | to_entries | length > 0 and all(.value.type == "http" and (.value.url | startswith("https://")))' claude/.mcp.json
